[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub-router"
version = "0.1.0"
description = "Lightweight Model Context Protocol (MCP) server & tool gateway router for aggregating, monitoring, and routing AI agent tool calls."
readme = "README.md"
authors = [{ name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
